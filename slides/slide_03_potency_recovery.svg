  </g>
  <g id="text_32">
   <text font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#6b6b6b" transform="translate(0 397.311572)">K<tspan font-size="7" dy="2.200">i</tspan><tspan dy="-2.200"> bins read from US9340546B2: +++ K</tspan><tspan font-size="7" dy="2.200">i</tspan><tspan dy="-2.200"> &lt; 0.01 µM, ++ 0.01–1 µM, + 1–5 µM.</tspan></text>
   <text font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#6b6b6b" transform="translate(0 408.983936)">The spreadsheet's labels come from a different table with different thresholds ('&lt; 20 nM' vs 'Inactive'), so the two columns are not directly comparable.</text>
